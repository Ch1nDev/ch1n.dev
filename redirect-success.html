<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>You may close this window</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0c0e;
    --surface:#15171a;
    --surface-2:#1b1e22;
    --border: rgba(255,255,255,0.09);
    --border-soft: rgba(255,255,255,0.05);
    --text:#f2f1ed;
    --muted:#8c8f94;
    --muted-2:#5e6166;
    --accent:#e8b454;
    --confirm:#5fd98a;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 48px 20px;
    line-height:1.5;
  }

  .page{ width:100%; max-width:480px; }

  .pill-wrap{ text-align:center; margin-bottom: 28px; }
  .pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:6px 14px 6px 10px;
    border:1px solid var(--border);
    border-radius:999px;
    background: var(--surface);
    font-size:13px;
    color: var(--muted);
    font-family: var(--font-mono);
    letter-spacing:0.02em;
  }
  .pill .dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--confirm);
  }

  .hero{ text-align:center; margin-bottom: 36px; }

  .check-wrap{ width:56px; height:56px; margin: 0 auto 20px; }
  .check-wrap svg{ width:100%; height:100%; }
  .check-circle{ fill:none; stroke: var(--confirm); stroke-width:2.4; }
  .check-mark{ fill:none; stroke: var(--confirm); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }

  h1{
    font-family: var(--font-display);
    font-weight:700;
    font-size: clamp(24px, 5vw, 32px);
    letter-spacing:-0.01em;
    margin-bottom:10px;
  }

  .subhead{
    color: var(--muted);
    font-size:15px;
    max-width: 360px;
    margin: 0 auto;
  }

  .section-label{
    font-family: var(--font-mono);
    font-size:11.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color: var(--muted-2);
    margin-bottom: 14px;
    text-align:center;
  }

  .projects{
    display:flex;
    flex-direction:row;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
    justify-content:center;
  }

  .project{
    --c: #ffffff;
    position:relative;
    display:inline-block;
    font-family: var(--font-mono);
    font-size:14px;
    letter-spacing:0.03em;
    text-decoration:none;
    padding: 6px 2px;
  }
  .project:focus-visible{ outline:2px solid #fff; outline-offset:2px; }

  .project.blue{ --c:#4da3ff; }
  .project.purple{ --c:#b06bff; }
  .project.green{ --c:#4ade80; }

  .project .label{
    color: var(--muted);
    transition: opacity 0.45s ease;
  }

  .project .glow{
    position:absolute;
    top:0; left:0;
    padding: 6px 2px;
    white-space:nowrap;
    pointer-events:none;
    opacity:0;
    transition: opacity 0.45s ease;
    background-image: repeating-linear-gradient(90deg, var(--c) 0px, #fff 60px, var(--c) 120px);
    background-size: 120px 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: text-scroll 2s linear infinite;
  }

  .project:hover .label, .project:focus-visible .label{ opacity:0; }
  .project:hover .glow, .project:focus-visible .glow{ opacity:1; }

  @keyframes text-scroll{
    from{ background-position: 0 0; }
    to{ background-position: 120px 0; }
  }

  @media (prefers-reduced-motion: reduce){
    .project .glow{ animation:none; color: var(--c); -webkit-text-fill-color: var(--c); }
    .project.pinkgreen .glow{ color:#ec4899; -webkit-text-fill-color:#ec4899; }
  }

  .project.pinkgreen .glow{
    background-image: repeating-linear-gradient(90deg, #ec4899 0px, #4ade80 60px, #ec4899 120px);
  }

  footer{
    text-align:center;
    font-size:12.5px;
    color: var(--muted-2);
    padding-top: 24px;
    margin-top: 28px;
    border-top:1px solid var(--border-soft);
  }
  footer .project{ font-size:12.5px; vertical-align:baseline; }
  footer .project .label{ color: var(--muted); }
</style>
</head>
<body>

<div class="page">

  <div class="pill-wrap">
    <span class="pill"><span class="dot"></span>Authorization complete</span>
  </div>

  <div class="hero">
    <div class="check-wrap">
      <svg viewBox="0 0 76 76">
        <circle class="check-circle" cx="38" cy="38" r="34" />
        <path class="check-mark" d="M24 39 L34 49 L53 28" />
      </svg>
    </div>
    <h1>You may close this window.</h1>
    <p class="subhead">Everything's connected. Head back to wherever you came from.</p>
  </div>

  <div class="section-label">While you're here</div>
  <div class="projects">
    <a class="project blue" href="https://cloudlight.games" target="_blank" rel="noopener">
      <span class="label">cloudlight.games ↗</span><span class="glow" aria-hidden="true">cloudlight.games ↗</span>
    </a>
    <a class="project purple" href="https://btfly.social" target="_blank" rel="noopener">
      <span class="label">btfly.social ↗</span><span class="glow" aria-hidden="true">btfly.social ↗</span>
    </a>
    <a class="project green" href="https://flipfinder.dev" target="_blank" rel="noopener">
      <span class="label">flipfinder.dev ↗</span><span class="glow" aria-hidden="true">flipfinder.dev ↗</span>
    </a>
  </div>

  <footer>
    Built by <a class="project pinkgreen" href="https://chinberclart.dev" target="_blank" rel="noopener">
      <span class="label">chinberclart.dev</span><span class="glow" aria-hidden="true">chinberclart.dev</span>
    </a>
  </footer>

</div>

</body>
</html>
