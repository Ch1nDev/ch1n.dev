    /* =========================
       PAGE
       ========================= */

    .page {
      position: relative;
      z-index: 1;

      width: 100%;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .wrapper {
      width: min(100%, 640px);

      display: flex;
      flex-direction: column;
      align-items: stretch;

      gap: 12px;
    }

    /* =========================
       MAIN CARD
       ========================= */

    .card {
      position: relative;

      width: 100%;

      padding: 26px 50px 26px;

      border-radius: 28px;

      background: rgba(255, 255, 255, 0.075);
      border: 1px solid rgba(255, 255, 255, 0.15);

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    h1 {
      font-size: clamp(3.5rem, 12vw, 6.5rem);
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: 0.04em;
      text-align: center;

      margin-bottom: 0;

      color: #fff;

      text-shadow:
        0 0 30px rgba(255, 255, 255, 0.08),
        0 0 80px rgba(17, 0, 46, 0.5);
    }

    .tag-card {
      display: block;

      margin: 0 0 16px -18px;

      text-align: left;

      font-size: 0.75rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .wordmark-card {
      width: 100%;

      padding: 30px 38px;

      border-radius: 28px;

      background: rgba(255, 255, 255, 0.075);
      border: 1px solid rgba(255, 255, 255, 0.15);

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    /* Links: single horizontal row, card widens to fit */
    .links {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: 10px;

      width: 100%;
    }

    .links a {
      flex: 0 0 auto;

      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 52px;

      padding: 13px 20px;

      border-radius: 999px;

      color: #fff;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);

      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;

      text-decoration: none;

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .links a:hover {
      transform: translateY(-2px);

      background: rgba(255, 255, 255, 0.11);
      border-color: rgba(255, 255, 255, 0.25);

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.25),
        0 0 25px rgba(17, 0, 46, 0.35);
    }

    .links a:active {
      transform: translateY(0);
    }

    /* =========================
       CONTACT BUTTON
       ========================= */

    .contact {
      display: flex;
      align-items: center;
      justify-content: space-between;

      width: 100%;
      min-height: 64px;

      padding: 0 24px;

      border-radius: 22px;

      color: #fff;
      background: rgba(255, 255, 255, 0.075);
      border: 1px solid rgba(255, 255, 255, 0.15);

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      box-shadow:
        0 15px 50px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);

      text-decoration: none;

      font-size: 0.95rem;
      font-weight: 600;

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .contact span:last-child {
      font-size: 1.3rem;
      font-weight: 500;

      transition: transform 0.2s ease;
    }

    .contact:hover {
      transform: translateY(-2px);

      background: rgba(255, 255, 255, 0.11);
      border-color: rgba(255, 255, 255, 0.25);

      box-shadow:
        0 18px 55px rgba(0, 0, 0, 0.4),
        0 0 30px rgba(17, 0, 46, 0.35);
    }

    .contact:hover span:last-child {
      transform: translateX(4px);
    }

    .contact:active {
      transform: translateY(0);
    }

    footer {
      position: fixed;
      bottom: 18px;
      left: 0;
      right: 0;
      z-index: 1;

      text-align: center;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.3);

       ========================= */
